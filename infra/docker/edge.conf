upstream casinoking_frontend_v1 {
    server frontend:3000;
}

upstream casinoking_frontend_v3 {
    server frontend-v3:3001;
}

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /site-v3-assets/_next/ {
        proxy_pass http://casinoking_frontend_v3/_next/;
    }

    location /site-v3-assets/ {
        proxy_pass http://casinoking_frontend_v3/;
    }

    location = /favicon.ico {
        proxy_pass http://casinoking_frontend_v1;
    }

    location /_next/ {
        proxy_pass http://casinoking_frontend_v1;
    }

    location /game-assets/ {
        proxy_pass http://casinoking_frontend_v1;
    }

    location /brand/ {
        proxy_pass http://casinoking_frontend_v1;
    }

    location /login {
        proxy_pass http://casinoking_frontend_v3;
    }

    location /register {
        proxy_pass http://casinoking_frontend_v3;
    }

    location /account {
        proxy_pass http://casinoking_frontend_v3;
    }

    location /admin {
        proxy_pass http://casinoking_frontend_v1;
    }

    location /legacy-games/mines {
        proxy_pass http://casinoking_frontend_v1/mines;
    }

    location /runtime/boxe {
        proxy_pass http://casinoking_frontend_v3;
    }

    location /runtime/hi-lo {
        proxy_pass http://casinoking_frontend_v3;
    }

    location /mines {
        proxy_pass http://casinoking_frontend_v3;
    }

    location /boxe {
        proxy_pass http://casinoking_frontend_v3;
    }

    location /hi-lo {
        proxy_pass http://casinoking_frontend_v3;
    }

    location / {
        proxy_pass http://casinoking_frontend_v3;
    }
}
