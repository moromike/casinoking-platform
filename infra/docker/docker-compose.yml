name: casinoking

services:
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    working_dir: /app/backend
    command: /bin/sh -lc "python -m app.tools.apply_migrations && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-CasinoKing Backend}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      DATABASE_URL: ${DATABASE_URL:-postgresql://casinoking:casinoking@postgres:5432/casinoking}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-60}
      SITE_V3_DRAFT_PREVIEW_SECRET: ${SITE_V3_DRAFT_PREVIEW_SECRET:-change-me-site-v3-draft-preview-secret-local-only}
      SITE_V3_PUBLIC_BASE_URL: ${SITE_V3_PUBLIC_BASE_URL:-http://localhost:3000}
      SITE_ACCESS_PASSWORD: ${SITE_ACCESS_PASSWORD:-change-me}
      MINES_SERVER_SEED: ${MINES_SERVER_SEED:-change-me-local-mines-server-seed}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ASSET_STORAGE_ROOT: ${ASSET_STORAGE_ROOT:-/app/backend/var/assets}
      ASSET_PUBLIC_BASE_URL: ${ASSET_PUBLIC_BASE_URL:-/static/games}
    volumes:
      - ../../backend:/app/backend
      - ../../docs/runtime:/app/docs/runtime:ro
      - ../../var/assets:/app/backend/var/assets
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-v3:
    build:
      context: ../..
      dockerfile: infra/docker/frontend-v3.Dockerfile
    working_dir: /app/frontend-v3
    command: /bin/sh -lc "mkdir -p .next && find .next -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + && npm run build && npm run start -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_SITE_V3_BASE_URL: ${NEXT_PUBLIC_SITE_V3_BASE_URL:-http://localhost:3000}
      SITE_V3_API_INTERNAL_BASE_URL: ${SITE_V3_API_INTERNAL_BASE_URL:-http://backend:8000/api/v1}
      SITE_V3_ASSET_PREFIX: ${SITE_V3_ASSET_PREFIX:-/site-v3-assets}
    volumes:
      - ../../frontend-v3:/app/frontend-v3
      - frontend_v3_node_modules:/app/frontend-v3/node_modules
      - frontend_v3_next:/app/frontend-v3/.next
    ports:
      - "${FRONTEND_V3_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy

  edge:
    image: nginx:1.27-alpine
    volumes:
      - ./edge.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${EDGE_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      frontend-v3:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casinoking}
      POSTGRES_USER: ${POSTGRES_USER:-casinoking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casinoking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-casinoking} -d ${POSTGRES_DB:-casinoking}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  frontend_v3_node_modules:
  frontend_v3_next:
  postgres_data:
