[pytest]
testpaths = tests
python_files = test_*.py
markers =
    integration: end-to-end or service-level integration checks
    unit: fast isolated unit tests
    api_service: backend HTTP/service game tests
    browser_smoke: browser/Playwright/frontend smoke tests
    concurrency: concurrent execution tests (serial only)
    migration_schema: schema/migration/bootstrap/drop-create tests
    money_admin: financial/admin/session force-close/reconciliation/wallet/ledger tests
    catalog: catalog/title/site config/publication/assets tests
    visual: visual screenshot/golden tests
    stress: stress/load tests
